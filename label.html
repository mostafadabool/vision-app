<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رؤية - ملصق الجهاز</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: installer's bench tool, plain and exact.
   IDEA: the pairing sticker that goes on the panel door, like a smart-device QR label.
   PICTURE: the printable sticker itself, large, beside the form.
   COLOUR and TYPE: VISION navy + water cyan, IBM Plex Sans Arabic.
   LAYOUT: form left/top, sticker preview right/below; print shows only the sticker. */
:root{--bg:#eef3f8;--ink:#0b1d30;--mut:#5a6b7d;--line:#d5dfe9;--navy:#0b2a4a;--water:#16a3d6}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans Arabic",Tahoma,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 18px;font-weight:700;font-size:19px}
header small{display:block;font-weight:400;font-size:13px;opacity:.75}
main{max-width:980px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;margin-bottom:10px;font-size:14px}
input{display:block;width:100%;font:inherit;font-size:16px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;margin-top:4px}
button{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--water);color:#fff;cursor:pointer;margin:4px 0 0 8px}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid #f2a516;outline-offset:2px}
.warn{font-size:13px;color:#8a4b00;background:#fff4e0;border-radius:10px;padding:10px;margin-top:10px}
/* sticker: 70 x 50 mm */
.sticker{width:70mm;height:50mm;margin:auto;background:#fff;border:1px solid #000;border-radius:3mm;display:grid;grid-template-columns:30mm 1fr;overflow:hidden;font-family:"IBM Plex Sans Arabic",Arial,sans-serif}
.sticker .side{background:var(--navy);color:#fff;display:grid;place-content:center;text-align:center;padding:2mm}
.sticker .side b{font:700 6mm/1 Arial,sans-serif;letter-spacing:.2mm}
.sticker .side small{font:italic 2.2mm/1.2 Arial,sans-serif;opacity:.8;margin-top:1mm}
.sticker .side span{font-size:2.6mm;margin-top:3mm;line-height:1.3}
.sticker .main{display:grid;grid-template-rows:auto 1fr auto;padding:2mm;text-align:center}
.sticker .qr{display:grid;place-items:center}.sticker .qr svg{width:27mm;height:27mm}
.sticker .nm{font-size:2.8mm;font-weight:700;line-height:1.2;max-height:7mm;overflow:hidden}
.sticker .id{font:2.4mm/1.2 Arial,sans-serif;direction:ltr}
.pv{display:grid;place-items:center;min-height:240px}
.note{font-size:13px;color:var(--mut)}
@media print{body{background:#fff}header,.card.form,.pvhead,.note{display:none}main{display:block;padding:0}.card{border:0;padding:0}.pv{min-height:0}}
</style>
</head>
<body>
<header>رؤية VISION<small>إنشاء ملصق باركود لإضافة جهاز إلى تطبيق الزبون</small></header>
<main>
  <section class="card form">
    <label>اسم الجهاز (يظهر للزبون)<input id="n" value="بوستر 6 مضخات"></label>
    <label>رقم الجهاز Device ID<input id="d" dir="ltr" value="em300-01"></label>
    <label>عنوان السيرفر<input id="u" dir="ltr" value="wss://y306863e.ala.eu-central-1.emqxsl.com:8084/mqtt"></label>
    <label>مستخدم التطبيق لهذا الجهاز<input id="a" dir="ltr" value="app-em300-01"></label>
    <label>كلمة مرور مستخدم التطبيق<input id="p" type="password" dir="ltr" autocomplete="off"></label>
    <label>رابط التطبيق<input id="app" dir="ltr" value="https://mostafadabool.github.io/vision-app/"></label>
    <div><button id="gen">إنشاء الباركود</button><button class="sec" id="print">طباعة الملصق</button><button class="sec" id="copy">نسخ رابط الإضافة</button></div>
    <p class="warn">الباركود يحتوي على بيانات دخول هذا الجهاز فقط. ضع الملصق <b>داخل باب البورد</b>، واجعل لكل جهاز مستخدماً خاصاً في EMQX لا يرى إلا مواضيع جهازه.</p>
    <p class="note" id="msg"></p>
  </section>
  <section class="card">
    <p class="note pvhead">معاينة الملصق (70 × 50 مم)</p>
    <div class="pv"><div class="sticker" id="st">
      <div class="side"><b>VISION</b><small>just push the button</small><span>امسح الباركود<br>لإضافة الجهاز</span></div>
      <div class="main"><div class="nm" id="snm">—</div><div class="qr" id="sqr"></div><div class="id" id="sid">—</div></div>
    </div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
let link='';
function gen(){
  const o={v:1,n:$('n').value.trim(),d:$('d').value.trim(),u:$('u').value.trim(),a:$('a').value.trim(),p:$('p').value};
  if(!o.d||!o.u){$('msg').textContent='اكتب رقم الجهاز وعنوان السيرفر.';return}
  if(!o.p){$('msg').textContent='تنبيه: بدون كلمة مرور لن يتصل التطبيق.';}else $('msg').textContent='';
  link=$('app').value.trim().replace(/#.*$/,'')+'#add='+b64e(o);
  if(!window.qrcode){$('msg').textContent='تعذّر تحميل مكتبة الباركود - تأكد من الإنترنت.';return}
  const q=qrcode(0,'M');q.addData(link);q.make();
  $('sqr').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
  $('snm').textContent=o.n||o.d;$('sid').textContent='ID: '+o.d;
}
$('gen').onclick=gen;
$('print').onclick=()=>{if(!link)gen();try{window.print()}catch(e){}};
$('copy').onclick=async()=>{if(!link)gen();try{await navigator.clipboard.writeText(link);$('msg').textContent='نُسخ الرابط. أرسله للزبون فيفتح التطبيق ويضيف الجهاز.'}catch(e){$('msg').textContent=link}};
}
</script>
</body>
</html>
